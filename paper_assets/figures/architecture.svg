<rect x="72.0" y="365.0" width="232.0" height="72.0" rx="6" fill="#E8ECEF" stroke="#68737D" stroke-width="1.4"/>
<text x="188.0" y="396.0" text-anchor="middle" font-size="16" font-weight="600" fill="#263238">Qdrant / Neo4j / services</text>
