<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
<title id="title">TxnMem 架构边界</title>
<desc id="desc">左侧是 Qwen、公共 runtime 和后端的非事务逐事件适配；中间是 TxnMem 的事务管理、策略、存储和来源修复 core；右侧是独立 reference simulator。</desc>
