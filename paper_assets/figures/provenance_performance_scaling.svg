<title id="title">v10 provenance-performance 扩展性</title>
<desc id="desc">v10 测量矩阵按 100、1,000 和 10,000 nodes 以及并发 1、2、4、8、16 组成 15 个 cell；上半图包含 15 个吞吐点及 95% 置信区间，下半图包含 15 个 p99 尾延迟点；100 nodes 在并发 2 达到被测峰值 21.899 ops/s；1,000 nodes 在并发 2 达到被测峰值 2.844 ops/s；10,000 nodes 在并发 1 达到被测峰值 0.123 ops/s。</desc>
