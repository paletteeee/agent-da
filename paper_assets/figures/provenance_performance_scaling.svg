<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
<title id="title">v10 provenance-performance 扩展性</title>
<desc id="desc">v10 测量矩阵包含 100、1,000 和 10,000 nodes 三条吞吐曲线；100 nodes 在并发 2 达到被测峰值 21.899 ops/s；1,000 nodes 在并发 2 达到被测峰值 2.844 ops/s；10,000 nodes 在并发 1 达到被测峰值 0.123 ops/s；所有点均带 95% 置信区间。</desc>
